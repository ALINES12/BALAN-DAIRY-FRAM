html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 'Hind Madurai',system-ui,sans-serif}
header{background:var(--g2);color:#fff;padding:10px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
header b{font-size:18px;flex:1}header button{background:#ffffff22;color:#fff;border:0;border-radius:6px;padding:5px 10px;cursor:pointer}
nav{display:flex;gap:4px;overflow-x:auto;padding:8px 12px;border-bottom:1px solid var(--line);background:var(--bg2)}
nav button{border:0;background:none;color:var(--ink);padding:8px 14px;border-radius:20px;cursor:pointer;white-space:nowrap;font:inherit}
nav button.on{background:var(--g);color:#fff}
main{padding:14px;max-width:1200px;margin:auto}
h2{margin:6px 0 10px;color:var(--g2)}@media(prefers-color-scheme:dark){h2{color:var(--g)}}
.k{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.k div{border:1px solid var(--line);border-left:4px solid var(--g);border-radius:8px;padding:10px;background:var(--bg2)}
.k small{color:var(--mut);display:block}.k b{font-size:20px}
.card{border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:14px}
.w{overflow-x:auto;max-height:70vh;border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;font-size:14px}th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{background:var(--bg2);position:sticky;top:0}
input,select,button.b,textarea{font:inherit;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink)}
input[type=number]{width:70px}
.f{display:flex;gap:8px;flex-wrap:wrap;align-items:end;margin-bottom:10px}.f label{display:flex;flex-direction:column;font-size:12px;color:var(--mut)}
button.b{background:var(--g);color:#fff;border:0;cursor:pointer}button.b.o{background:none;color:var(--g);border:1px solid var(--g)}button.b.d{background:var(--bad)}
.bad{color:var(--bad)}.ok{color:var(--g)}.warn{color:var(--warn)}
.cal td{text-align:center;padding:4px 2px;font-size:12px;min-width:24px}.D{background:#bfe5c9;color:#0f3d22}.M{background:#f6c3be;color:#6d140e}.P{background:#ffe0a3;color:#5c3c00}
#login{max-width:340px;margin:12vh auto;padding:20px;border:1px solid var(--line);border-radius:12px;text-align:center}
#login input,#login select{width:100%;margin:6px 0}#t{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--g2);color:#fff;padding:8px 16px;border-radius:8px;display:none}
@media print{header,nav,.np{display:none!important}.w{max-height:none}}
</style></head><body>

    if(p0&&i>=p0&&i<p0+pl){v[k+'s']='M';v[k+'r']='Out of town'}else if(R()<.03){v[k+'s']='M';v[k+'r']='Customer not at home'}else{v[k+'s']='D';if(R()<.04)v[k]=q+.5}});

  (late?NX:P).push({cid:c.id,date:d,amt,mode:c.pm=='UPI'?'UPI':'Cash',st:full?'Paid':'Partially paid',note:'Sample data',pf:m+'-01',pt:m+'-'+pads(n),at:now,by:'delivery',smp:1})});
 put('pay_'+m,(C['pay_'+m]||[]).concat(P));if(NX.length){const k='pay_'+T.slice(0,7);put(k,(C[k]||[]).concat(NX))}

 for(let i=1;i<=n;i++)FD.push({t:'use',date:m+'-'+pads(i),kg:150+Math.round(R()*20),note:'Sample data',by:'worker',smp:1});

async function setPin(){const p=$('#sp').value;if(p.length<4)return toast('Use 4+ digits');const u={...C.users};u[$('#sr').value]=await hash(p);put('users',u);PINDEF=PINDEF.filter(r=>r!=$('#sr').value);toast('PIN changed')}
